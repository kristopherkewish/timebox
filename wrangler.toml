name = "timebox"
compatibility_date = "2025-04-01"
pages_build_output_dir = "dist"

# D1 binding. To create the database, run:
#   wrangler d1 create timebox-db
# Then paste the returned database_id below. Until that is set, Functions that
# touch the DB will fail at runtime, but the Phase 1 stub endpoints (which
# return hardcoded data) work without a real DB.
[[d1_databases]]
binding = "DB"
database_name = "timebox-db"
database_id = "c23fa4a6-ab32-4acb-8c04-4c0d98c38d20"
migrations_dir = "migrations"
